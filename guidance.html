<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steer the model · RFD4 Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page">
  <section class="intro">
    <h1 data-t="guidance.title"></h1>
    <p data-t="guidance.intro"></p>
  </section>

  <section class="card">
    <h2 data-t="guidance.partialTitle"></h2>
    <p data-t="guidance.partial"></p>
    <label class="small-label" for="frac" data-t="guidance.fracLabel"></label>
    <input type="range" id="frac" min="0.05" max="1" step="0.05" value="0.3">
    <div id="partial"></div>
    <dl class="readout" id="partialRead"></dl>
    <pre class="code" id="partialCmd"></pre>
    <p class="note warn" data-t="guidance.notTime"></p>
  </section>

  <section class="card">
    <h2 data-t="guidance.invfoldTitle"></h2>
    <p data-t="guidance.invfold"></p>
    <pre class="code" id="invfoldCmd"></pre>
    <table class="grid small" id="invfoldOpts"></table>
  </section>

  <section class="card">
    <h2 data-t="guidance.metricTitle"></h2>
    <p data-t="guidance.metric"></p>
    <p class="note warn" data-t="guidance.metricCaution"></p>
  </section>

  <section class="card">
    <h2 data-t="guidance.searchTitle"></h2>
    <p data-t="guidance.search"></p>
    <div id="searchTree"></div>
    <table class="grid small" id="searchOpts"></table>
    <p class="note warn" data-t="guidance.searchCost"></p>
  </section>
</main>
<script type="module" src="js/pages/guidance.js"></script>
</body>
</html>
